<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MYTHBOUND</title>
<style>
  :root { --bg:#0b0714; --gold:#e8b84a; --ink:#f4ead2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:monospace; color:var(--ink); }
  #wrap { position:relative; }
  canvas#game { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; box-shadow:0 0 0 2px #3a2a12, 0 0 40px #000; }
  #mute { position:fixed; top:8px; right:8px; z-index:20; width:40px; height:40px; border:2px solid var(--gold); background:#1b1226cc; color:var(--gold); font:bold 13px monospace; cursor:pointer; border-radius:4px; }
  #touch { position:fixed; left:0; right:0; bottom:0; height:190px; z-index:15; display:none; pointer-events:none; }
  body.touch #touch { display:block; }
  @media (orientation: portrait) { body.touch { align-items:flex-start; padding-top:56px; } }
  .tbtn { position:absolute; pointer-events:auto; background:#ffffff22; border:2px solid #ffffff55; color:#fff; font:bold 18px monospace; display:flex; align-items:center; justify-content:center; border-radius:10px; }
  .tbtn.on { background:#e8b84a88; }
  #dU{left:62px;bottom:116px;width:52px;height:52px} #dD{left:62px;bottom:12px;width:52px;height:52px}
  #dL{left:10px;bottom:64px;width:52px;height:52px} #dR{left:114px;bottom:64px;width:52px;height:52px}
  #bA{right:16px;bottom:78px;width:64px;height:64px;border-radius:50%} #bB{right:90px;bottom:34px;width:58px;height:58px;border-radius:50%}
  #bS{right:16px;bottom:10px;width:64px;height:30px;font-size:12px}
  #ideaBox { position:fixed; z-index:30; display:none; left:50%; top:30%; transform:translateX(-50%); width:min(560px,94vw); background:#1b1226; border:3px solid var(--gold); padding:12px; border-radius:6px; box-shadow:0 0 0 4px #000; }
  #ideaBox label { display:block; color:var(--gold); font:bold 14px monospace; margin-bottom:8px; }
  #ideaInput { width:100%; font:16px monospace; padding:8px; background:#0b0714; color:#fff; border:2px solid #6b5426; outline:none; }
  #ideaBox .row { display:flex; justify-content:space-between; margin-top:8px; font:12px monospace; color:#bba; }
  #ideaBox button { font:bold 13px monospace; background:#e8b84a; border:0; padding:6px 12px; margin-left:6px; cursor:pointer; }
  #ideaBox button.sec { background:#5a4a66; color:#fff; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="240"></canvas></div>
<button id="mute" title="Mute (also key: N)">♪</button>
<div id="touch">
  <div class="tbtn" id="dU" data-k="up">▲</div><div class="tbtn" id="dD" data-k="down">▼</div>
  <div class="tbtn" id="dL" data-k="left">◀</div><div class="tbtn" id="dR" data-k="right">▶</div>
  <div class="tbtn" id="bA" data-k="a">A</div><div class="tbtn" id="bB" data-k="b">B</div>
  <div class="tbtn" id="bS" data-k="start">MENU</div>
</div>
<div id="ideaBox">
  <label for="ideaInput">Describe your custom attack (max 120 characters)</label>
  <input id="ideaInput" maxlength="120" autocomplete="off" spellcheck="false" placeholder="e.g. Summon a wave that pushes the enemy back and shields my creature">
  <div class="row"><span id="ideaCount">0/120</span><span><button class="sec" id="ideaCancel">Cancel (Esc)</button><button id="ideaOk">Channel (Enter)</button></span></div>
</div>
<script>
/*__GAME_JS__*/
</script>
</body>
</html>
